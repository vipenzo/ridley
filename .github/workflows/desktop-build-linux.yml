name: Desktop Build (Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build for and upload the AppImage/.deb to (e.g. v1.11.0). Leave blank to use the workflow ref."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    # The binary links against the build host's glibc: building on the oldest
    # supported Ubuntu is what lets the .deb and the AppImage start on 22.04,
    # 24.04 and later alike. On 24.04 they would refuse to start on 22.04.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # libfive (cmake, boost, eigen, libpng) + the Tauri v2 webview (WebKitGTK
      # 4.1, GTK 3, rsvg) + what linuxdeploy needs to assemble the AppImage.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libboost-all-dev libeigen3-dev libpng-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libxdo-dev file patchelf libfuse2

      - name: Clone libfive
        run: |
          git clone --depth 1 https://github.com/libfive/libfive.git \
            desktop/src-tauri/vendor/libfive

      - name: Install npm dependencies
        run: npm ci

      # public/manual/ is gitignored and Tauri bundles public/ verbatim: without
      # this the app ships a manual index with blank pages (see the macOS job).
      - name: Sync manual content into public/
        run: npm run sync-manual

      - name: Resolve build tag
        id: tag
        run: |
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-dev}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend (production JS)
        run: |
          npx shadow-cljs release app \
            --config-merge "{:closure-defines {ridley.version/VERSION \"${{ steps.tag.outputs.value }}\"}}"

      - name: Stamp the bundle version from the tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          # Same rule as the macOS job: the leading N.N.N of the tag, or the
          # checked-in baseline when the ref is a branch name.
          VERSION=$(printf '%s' "${TAG#v}" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$VERSION" ]; then
            jq --arg v "$VERSION" '.version = $v' desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            mv /tmp/tauri.conf.json desktop/src-tauri/tauri.conf.json
            echo "bundle version stamped from '$TAG': $VERSION"
          else
            echo "tag '$TAG' carries no N.N.N — keeping the checked-in baseline"
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # libfive ends up inside both bundles without a post-build step: build.rs
      # stages the .so files and tauri.conf.json's bundle.linux.deb.files ships
      # them in /usr/lib/ridley; linuxdeploy copies them into the AppImage.
      - name: Build Tauri app
        working-directory: desktop/src-tauri
        # A cached target/ may still hold an older version's bundles, and the
        # steps below pick them up by glob.
        run: |
          rm -rf target/release/bundle
          cargo tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Check libfive is inside the .deb
        run: |
          DEB=$(ls desktop/src-tauri/target/release/bundle/deb/*.deb)
          dpkg -c "$DEB" | grep -q 'usr/lib/ridley/libfive.so' \
            || { echo "libfive.so missing from $DEB"; exit 1; }
          dpkg -c "$DEB" | grep -q 'usr/lib/ridley/libfive-stdlib.so' \
            || { echo "libfive-stdlib.so missing from $DEB"; exit 1; }

      - name: Name the bundles after the tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          B=desktop/src-tauri/target/release/bundle
          cp $B/deb/*.deb "Ridley-${TAG}-linux-amd64.deb"
          cp $B/appimage/*.AppImage "Ridley-${TAG}-linux-x86_64.AppImage"
          ls -la Ridley-*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ridley-linux
          path: |
            Ridley-*.deb
            Ridley-*.AppImage

      - name: Attach to release
        if: startsWith(steps.tag.outputs.value, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            Ridley-*.deb Ridley-*.AppImage --clobber
